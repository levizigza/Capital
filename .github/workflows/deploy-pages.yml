name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Do not call qa.yml here. Its e2e-smoke job hangs on `playwright install`
  # (hours, not minutes) and a reusable workflow cannot finish until every
  # child job ends — so Pages never reached build. Standalone QA still runs
  # on push to main. Gate the static ship on unit/content/lint/security only.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run content:validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm test -- src/security src/islands/familyRoom.test.ts

  build:
    needs: [unit, content, lint, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Stamp health + build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Ensures Vite base matches https://levizigza.github.io/Capital/
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BUILD_ID: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify health manifest
        run: |
          test -f dist/health.json
          node -e "const h=require('./dist/health.json'); if(h.status!=='ok') process.exit(1); console.log('health ok', h.buildId)"

      - name: SPA fallback (404 → index)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
